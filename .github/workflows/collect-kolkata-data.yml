name: Collect Kolkata traffic and weather data

on:
  workflow_dispatch:
  schedule:
    # Run automatically every 15 minutes.
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: kolkata-data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Collect one row
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: python backend/data_collector.py

      - name: Commit new CSV row
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/kolkata_traffic_weather.csv
          if git diff --cached --quiet; then
            echo "No new row to commit."
            exit 0
          fi
          git commit -m "data: collect Kolkata traffic and weather row"
          git pull --rebase origin main
          git push
