name: Collect Kolkata traffic and weather data

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes, deliberately offset from :00 to avoid GitHub peak-minute load.
    # This is every 15 minutes in UTC and therefore also every 15 minutes in Kolkata.
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: kolkata-data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Check API secrets
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          test -n "$TOMTOM_API_KEY" || (echo "TOMTOM_API_KEY is missing" && exit 1)
          test -n "$OPENWEATHER_API_KEY" || (echo "OPENWEATHER_API_KEY is missing" && exit 1)
          echo "Both API secrets are configured."

      - name: Collect all monitored Kolkata road checkpoints
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: python backend/data_collector.py

      - name: Record successful collection heartbeat
        run: |
          mkdir -p data/status
          date -u +"%Y-%m-%dT%H:%M:%SZ" > data/status/last_successful_collection_utc.txt

      - name: Commit new data and heartbeat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/kolkata_traffic_weather.csv data/status/last_successful_collection_utc.txt
          if git diff --cached --quiet; then
            echo "No new data changes to commit."
            exit 0
          fi
          git commit -m "data: collect Kolkata traffic and weather row"
          git pull --rebase origin main
          git push
