name: Train and evaluate Kolkata ML model
on:
  push:
    paths:
      - ".github/workflows/train-evaluate.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  train-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ML dependencies
        run: python -m pip install -r ml/requirements.txt
      - name: Clean real historical CSV
        run: python ml/clean_data.py
      - name: Train model
        run: |
          set -o pipefail
          python -m ml.train_model | tee documentation/ML_TRAINING_LOG.txt
      - name: Evaluate held-out test set
        run: python -m ml.evaluate_model
      - name: Upload cleaned CSV, model and evaluation as run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kolkata-ml-training-output
          path: |
            data/processed/kolkata_traffic_weather_clean.csv
            ml/artifacts/congestion_model.joblib
            documentation/ML_EVALUATION_RESULTS.json
            documentation/ML_TRAINING_LOG.txt
      - name: Commit cleaned dataset and verified metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/kolkata_traffic_weather_clean.csv
          git add documentation/ML_EVALUATION_RESULTS.json documentation/ML_TRAINING_LOG.txt
          if ! git diff --cached --quiet; then
            git commit -m "data: save cleaned Kolkata CSV and measured ML results"
            git push
          fi
