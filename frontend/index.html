<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Traffic Congestion Prediction</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><header><h1>Traffic Congestion Prediction</h1><button id="refresh">Refresh</button></header><main><div class="grid"><div>Congestion<strong id="level">—</strong></div><div>Current speed<strong id="speed">—</strong></div><div>Predicted speed<strong id="predicted">—</strong></div><div>Confidence<strong id="confidence">—</strong></div></div><section><div id="map"></div><aside><h2>Prediction</h2><label>Latitude<input id="lat" value="22.5726"></label><label>Longitude<input id="lon" value="88.3639"></label><label>Speed<input id="inputSpeed" value="35"></label><label>Free-flow<input id="freeFlow" value="50"></label><label>Weather impact %<input id="weather" value="0"></label><button id="predict">Predict</button><p id="status">Ready.</p></aside></section><div class="history"><h2>Recent predictions</h2><table><thead><tr><th>Time</th><th>Level</th><th>Speed</th><th>Confidence</th></tr></thead><tbody id="history"></tbody></table></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script></body></html>
