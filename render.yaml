services:
  - type: web
    name: traffic-congestion-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && cd .. && python ml/train_model.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: traffic-postgres
          property: connectionString
      - key: TOMTOM_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
databases:
  - name: traffic-postgres
    plan: free
