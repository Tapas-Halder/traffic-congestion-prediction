services:
  - type: web
    name: traffic-congestion-prediction
    runtime: python
    rootDir: .
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt && python ml/train_model.py
    startCommand: cd backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: TOMTOM_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: "*"
